[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["editors/zed"]

[workspace.package]
version = "0.1.0-alpha.3"
authors = ["Jatinjit Singh <hi@jatinjitsingh.com>"]
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/istorry/nifty"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
module_name_repetitions = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
