# Link the C runtime statically so nf.exe, and the apps it links against nifty_rt.lib, run
# on a clean Windows install without the Visual C++ Redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
