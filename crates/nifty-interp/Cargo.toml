[package]
name = "nifty-interp"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nifty-check = { path = "../nifty-check" }
nifty-runtime = { path = "../nifty-runtime" }
nifty-syntax = { path = "../nifty-syntax" }
# The system's TLS (Security.framework, SChannel) keeps app bundles small. ureq refuses
# https at runtime unless the full `native-tls` feature is on, not just `-no-default`.
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }

[dev-dependencies]
nifty-runtime = { path = "../nifty-runtime", features = ["testing"] }

[lints]
workspace = true
