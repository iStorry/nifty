[package]
name = "nifty-codegen"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cranelift-codegen = "0.124.3"
cranelift-frontend = "0.124.3"
cranelift-module = "0.124.3"
cranelift-native = "0.124.3"
cranelift-object = "0.124.3"
nifty-check = { path = "../nifty-check" }
nifty-rt = { path = "../nifty-rt" }
nifty-runtime = { path = "../nifty-runtime" }
nifty-syntax = { path = "../nifty-syntax" }

[dev-dependencies]
# Loads compiled programs in-process, so tests can drive them on the fake backend.
cranelift-jit = "0.124.3"
nifty-download = { path = "../nifty-download", features = ["testing"] }
nifty-interp = { path = "../nifty-interp" }
nifty-runtime = { path = "../nifty-runtime", features = ["testing"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Cranelift's object writer, to mark objects with the macOS version they're built for.
object = { version = "0.37.3", default-features = false, features = ["macho", "write"] }

[target.'cfg(windows)'.dependencies]
# Finds the MSVC linker where Visual Studio or its Build Tools installed it.
cc = "1.2"

[lints]
workspace = true
